services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_DB: cris, POSTGRES_PASSWORD: cris}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d cris"], interval: 3s, retries: 20}
  app:
    build: .
    environment: {DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:cris@db:5432/cris}"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
